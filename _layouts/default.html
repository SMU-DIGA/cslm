<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% if page.title and page.title != "Home" %}{{ page.title }} · {% endif %}{{ site.title }} — Computer Science of Language Models</title>
<meta name="description" content="{{ page.description | default: site.description }}" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&amp;display=swap" />
<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css" />
<script>
  // Apply the saved/preferred theme before first paint.
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>

<div class="masthead">
  <div class="masthead__inner">
    <a class="site-title" href="{{ site.baseurl }}/">CSLM</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">☰</button>
    <ul class="nav-links" id="nav-links">
      <li><a href="{{ site.baseurl }}/#differences">Differences</a></li>
      <li><a href="{{ site.baseurl }}/#token-complexity">Token Complexity</a></li>
      <li><a href="{{ site.baseurl }}/#roadmap">Roadmap</a></li>
      <li><a href="{{ site.baseurl }}/#our-work">Our Work</a></li>
      <li><a href="{{ site.baseurl }}/#reading-list">Reading List</a></li>
      <li><button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"><span id="theme-icon">☾</span></button></li>
    </ul>
  </div>
</div>

<div class="layout">
  <main class="content">
    {{ content }}
  </main>
</div>

<footer class="site-footer">
  <div class="site-footer__inner">
    <span>Computer Science of Language Models · <a href="https://rainwangphy.github.io/lab.html">DIGA@SMU</a></span>
    <span>Let's build the computer science for language models together.</span>
  </div>
</footer>

<script>
(function () {
  var root = document.documentElement;
  var icon = document.getElementById('theme-icon');
  function sync() { icon.textContent = root.getAttribute('data-theme') === 'dark' ? '☀' : '☾'; }
  sync();
  document.getElementById('theme-toggle').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    sync();
  });
  var links = document.getElementById('nav-links');
  document.getElementById('nav-toggle').addEventListener('click', function () {
    links.classList.toggle('is-open');
  });
  links.addEventListener('click', function (e) {
    if (e.target.tagName === 'A') links.classList.remove('is-open');
  });
})();
</script>
</body>
</html>
